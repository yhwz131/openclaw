<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>行政 · 链路追踪</title>
<style>
  :root { --bg:#061a38; --card:#0b2a52; --line:#1d4a80; --txt:#e6f0fa; --dim:#8fb6dc; --ok:#26d098; --no:#ff6b8a; --warn:#ffb74d; --cyan:#29b6f6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.45 "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif; padding:22px 28px; }
  h1 { margin:0 0 4px; font-size:26px; }
  h1 span { color:var(--no); }
  .sub { color:var(--dim); margin-bottom:16px; }
  .live { float:right; color:var(--dim); font-size:13px; }
  .live b { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--ok); margin-right:6px; animation:p 1.4s infinite; }
  @keyframes p { 50% { opacity:.25; } }
  .turn { background:#0a2347; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  .turn.fresh { border-color:var(--cyan); box-shadow:0 0 0 2px rgba(41,182,246,.25); }
  .meta { display:flex; gap:12px; align-items:baseline; margin-bottom:9px; }
  .who { font-weight:700; padding:2px 10px; border-radius:6px; font-size:14px; }
  .who.hr { background:rgba(38,208,152,.18); color:var(--ok); }
  .who.emp { background:rgba(255,107,138,.18); color:var(--no); }
  .who.other { background:rgba(255,183,77,.18); color:var(--warn); }
  .say { font-size:16px; }
  .time { margin-left:auto; color:var(--dim); font-size:13px; font-family:Consolas,monospace; }
  .hops { display:grid; grid-template-columns: repeat(6, 1fr) 150px; gap:8px; }
  .hop { background:var(--card); border:1px solid var(--line); border-radius:9px; padding:7px 9px; min-height:78px; position:relative; }
  .hop:not(:last-child)::after { content:"→"; position:absolute; right:-14px; top:28px; color:var(--dim); font-size:14px; }
  .hop .k { color:var(--dim); font-size:12px; margin-bottom:3px; }
  .hop .v { font-size:15px; word-break:break-all; }
  .hop code { font-family:Consolas,monospace; font-size:13.5px; color:#cfe3f7; }
  .hop.ok { border-color:rgba(38,208,152,.6); }
  .hop.no { border-color:var(--no); background:rgba(255,107,138,.12); }
  .hop.skip { opacity:.35; }
  .pair { display:grid; grid-template-columns:auto 1fr; gap:0 6px; font-size:13.5px; }
  .pair .bad { color:var(--no); font-weight:700; }
  .end { border-radius:9px; display:flex; align-items:center; justify-content:center; text-align:center; font-weight:700; font-size:16px; }
  .end.ok { background:rgba(38,208,152,.18); color:var(--ok); border:1px solid var(--ok); }
  .end.no { background:rgba(255,107,138,.15); color:var(--no); border:1px solid var(--no); }
  .end.na { background:var(--card); color:var(--dim); border:1px solid var(--line); }
  .empty { color:var(--dim); padding:40px; text-align:center; }
</style>
</head>
<body>
<div class="live"><b></b>每 2 秒读一次网关会话记录与闸门日志</div>
<h1>行政 · 链路追踪：<span>一句话在系统里走了哪几跳</span></h1>
<div class="sub">飞书 → 网关 → 模型 → 执行白名单 → 身份反查 → 闸门 → HCM　·　全部取自真实运行记录</div>
<div id="list"><div class="empty">等待飞书消息…</div></div>
<script>
const WHO = { hr: ['HR', 'hr'], denied: ['员工', 'emp'], unknown: ['未登记', 'other'], demo: ['本地', 'other'] };
const short = (c) => c.replace(/^(请直接执行\s*)?bash\s+scripts\/er-admin-run\.sh\s+/, '$1').replace(/ou_[0-9a-f]{28}([0-9a-f]{4})/g, 'ou_…$1');
const roleName = (r) => ({ hr: 'HR', denied: '员工', unknown: '未登记', demo: '本地', local: '本地会话', notfound: '查不到', ambiguous: '分不清', '未传': '未传' }[r] || r || '—');
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const hm = (t) => new Date(t * 1000).toLocaleTimeString('zh-CN', { hour12: false });
let lastTop = 0;

function render(data) {
  const only = new URLSearchParams(location.search).get('only') === 'sensitive';
  const botOnly = new URLSearchParams(location.search).get('bot');
  const turns = (data.turns || []).filter((t) => !botOnly || t.account === botOnly).filter((t) => !only || /薪资|工资|月报/.test(t.text) || t.calls.some((c) => /payroll-query|monthly-report/.test(c.command))).reverse().slice(0, 3);
  if (!turns.length) return;
  const html = turns.map((t, i) => {
    const [who, cls] = WHO[t.role] || [t.role, 'other'];
    const ex = t.calls.filter((c) => c.tool === 'exec' && /er-admin-run\.sh|curl|python|cat|bash|sh /.test(c.command));
    const c = ex.find((c) => /payroll-query|monthly-report/.test(c.command)) || ex[0];
    const bot = t.account === 'admin' ? '行政 bot · 直达行政' : '总控 bot';
    const tools = (t.tools || []).join(' ');
    const hop = (k, v, s = '') => `<div class="hop ${s}"><div class="k">${k}</div><div class="v">${v}</div></div>`;
    let h = hop('① 飞书', `${esc(bot)}`, 'ok') + hop('② 网关 · 工具档', `<code>${esc(tools)}</code>`, 'ok');
    let end;
    if (!c) {
      h += hop('③ 模型', '没有调用脚本<br>自己拒绝 / 直接回答', 'ok') + hop('④ 执行白名单', '—', 'skip') + hop('⑤ 身份反查', '—', 'skip') + hop('⑥ 闸门', '—', 'skip');
      end = /薪资|工资|月报/.test(t.text) ? ['no', '未取数'] : ['na', '无敏感调用'];
    } else {
      h += hop('③ 模型发出的命令', `<code>${esc(short(c.command))}</code>`, 'ok');
      if (c.allowlisted === false) {
        h += hop('④ 执行白名单', '拒绝执行', 'no') + hop('⑤ 身份反查', '—', 'skip') + hop('⑥ 闸门', '—', 'skip');
        end = ['no', '白名单拦下'];
      } else {
        h += hop('④ 执行白名单', '放行（唯一入口）', 'ok');
        if (c.resolved) {
          const bad = c.givenRole !== '未传' && c.givenRole !== c.resolvedRole;
          h += hop('⑤ 身份反查', `<div class="pair"><span>模型报</span><span class="${bad ? 'bad' : ''}">${roleName(c.givenRole)}</span><span>网关记</span><span>${roleName(c.resolvedRole)}</span></div>`, bad ? 'no' : 'ok');
        } else {
          h += hop('⑤ 身份反查', /payroll-query|monthly-report/.test(c.command) ? '当时未启用' : '不涉及', 'skip');
        }
        if (/payroll-query|monthly-report/.test(c.command)) {
          const pass = c.exit === 0;
          h += hop('⑥ 闸门', pass ? 'exit 0 · 放行' : `exit ${c.exit ?? '?'} · 拒绝`, pass ? 'ok' : 'no');
          const m = /"count":\s*(\d+)/.exec(c.out || '');
          end = pass ? ['ok', `读 HCM${m ? ' · ' + m[1] + ' 人' : ''}`] : ['no', '未读 HCM<br>没有任何数据'];
        } else {
          h += hop('⑥ 闸门', '不过闸（非敏感）', 'skip');
          end = ['na', '制度检索'];
        }
      }
    }
    h += `<div class="end ${end[0]}">${end[1]}</div>`;
    const fresh = i === 0 && t.t > lastTop && lastTop ? ' fresh' : '';
    return `<div class="turn${fresh}"><div class="meta"><span class="who ${cls}">${who}</span><span class="say">“${esc(short(t.text).slice(0, 70))}”</span><span class="time">${hm(t.t)}</span></div><div class="hops">${h}</div></div>`;
  }).join('');
  document.getElementById('list').innerHTML = html;
  lastTop = Math.max(lastTop, turns[0].t);
}
async function tick() {
  try { render(await (await fetch('/api/trace', { cache: 'no-store' })).json()); } catch (e) {}
}
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
