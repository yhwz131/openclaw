<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>行政 · 消融实验</title>
<style>
  :root { --bg:#061a38; --card:#0b2a52; --line:#1d4a80; --txt:#e6f0fa; --dim:#8fb6dc; --ok:#26d098; --no:#ff6b8a; --warn:#ffb74d; --cyan:#29b6f6; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.45 "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif; padding:22px 28px; }
  h1 { margin:0 0 4px; font-size:26px; } h1 span { color:var(--no); }
  .sub { color:var(--dim); margin-bottom:14px; }
  button { float:right; background:var(--cyan); color:#061a38; border:0; border-radius:8px; padding:8px 18px; font-size:15px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; }
  table { width:100%; border-collapse:separate; border-spacing:6px; }
  th { color:var(--dim); font-weight:600; font-size:14px; padding:4px 6px; }
  th.cfg { background:var(--card); border:1px solid var(--line); border-radius:8px; color:var(--txt); }
  th.cfg.now { border-color:var(--ok); }
  th.cfg .n { display:block; font-size:22px; font-weight:800; color:var(--dim); }
  th.cfg .n.ok { color:var(--ok); } th.cfg .n.no { color:var(--no); }
  td { border-radius:8px; text-align:center; padding:7px 4px; font-size:14px; cursor:pointer; border:1px solid transparent; }
  td.row { text-align:left; color:var(--txt); font-weight:600; background:var(--card); border:1px solid var(--line); padding-left:12px; width:130px; cursor:default; }
  td.wait { background:rgba(11,42,82,.5); color:#3d6390; border:1px dashed var(--line); }
  td.ok { background:rgba(38,208,152,.12); color:var(--ok); border-color:rgba(38,208,152,.35); }
  td.no { background:rgba(255,107,138,.22); color:#fff; border-color:var(--no); font-weight:800; }
  td.cur { outline:2px solid var(--cyan); outline-offset:1px; }
  td small { display:block; color:var(--dim); font-size:12px; font-weight:400; }
  td .dots { display:flex; gap:4px; justify-content:center; margin-top:3px; }
  td .dots i { width:9px; height:9px; border-radius:50%; background:#2a4d78; }
  i.ok { background:var(--ok) !important; } i.fix { background:var(--warn) !important; } i.stop { background:var(--cyan) !important; }
  i.leak { background:var(--no) !important; } i.off { background:transparent !important; border:1.5px dashed var(--dim); width:6px !important; height:6px !important; }
  tr.ctl td.row { color:var(--cyan); }
  #d { margin-top:12px; background:#0a2347; border:1px solid var(--line); border-radius:12px; padding:12px 14px; min-height:150px; }
  #d .t { font-weight:700; margin-bottom:8px; } #d .t span { color:var(--dim); font-weight:400; margin-left:10px; font-size:13px; }
  .hops { display:grid; grid-template-columns: repeat(4, 1fr) 170px; gap:10px; }
  .hop { background:var(--card); border:1px solid var(--line); border-radius:9px; padding:8px 10px; min-height:62px; position:relative; }
  .hop:not(:last-child)::after { content:"→"; position:absolute; right:-14px; top:22px; color:var(--dim); }
  .hop .k { color:var(--dim); font-size:12px; } .hop .v { font-size:15px; }
  .hop.ok { border-color:rgba(38,208,152,.6); } .hop.fix { border-color:var(--warn); color:var(--warn); }
  .hop.stop { border-color:var(--cyan); background:rgba(41,182,246,.15); } .hop.leak { border-color:var(--no); background:rgba(255,107,138,.15); }
  .hop.off { border-style:dashed; opacity:.7; } .hop.skip { opacity:.35; }
  .end { border-radius:9px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:17px; }
  .end.ok { background:rgba(38,208,152,.18); color:var(--ok); border:1px solid var(--ok); }
  .end.no { background:rgba(255,107,138,.2); color:var(--no); border:1px solid var(--no); }
  pre { margin:10px 0 0; background:#061a38; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:13px/1.5 Consolas,monospace; color:#cfe3f7; white-space:pre-wrap; max-height:120px; overflow:auto; }
  .legend { color:var(--dim); font-size:12.5px; margin-top:6px; }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin:0 3px 0 10px; vertical-align:middle; }
  .foot { color:var(--dim); margin-top:10px; font-size:13px; }
</style>
</head>
<body>
<button id="b" onclick="run()">重跑</button>
<h1>行政 · 消融实验：<span>每一层都不是摆设</span></h1>
<div class="sub">假设模型已被完全骗过：攻击者要它发什么命令，它就发什么。每次关掉一层，在临时工作区里真跑，读真实 HCM，看员工能不能拿到员工1的薪资。</div>
<div id="t"></div>
<div class="legend">每格四个点 = 执行白名单 · 身份反查 · 闸门 · HCM：<i class="ok"></i>放行 <i class="fix"></i>纠正身份 <i class="stop"></i>在此挡住 <i class="leak"></i>泄露 <i class="off"></i>这一层已去掉　·　点任意一格看它的完整过程</div>
<div id="d"><div class="t">等待运行…</div></div>
<div class="foot" id="f"></div>
<script>
const PACE = +(new URLSearchParams(location.search).get('pace') ?? 300);
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let meta, done = {}, running = false;

function skeleton() {
  const atk = meta.attacks;
  let h = '<table><tr><th></th>' + meta.configs.map((c, i) => `<th class="cfg${i === 0 ? ' now' : ''}">${esc(c)}<span class="n" id="n-${i}">…</span></th>`).join('') + '</tr>';
  atk.forEach((a, r) => {
    h += `<tr class="${a === 'HR 正常查' ? 'ctl' : ''}"><td class="row">${esc(a)}</td>` +
      meta.configs.map((c, k) => `<td class="wait" id="c-${k}-${r}" onclick="show('${k}-${r}')">…</td>`).join('') + '</tr>';
  });
  document.getElementById('t').innerHTML = h + '</table>';
}

function show(id) {
  const c = done[id]; if (!c) return;
  document.querySelectorAll('td.cur').forEach((x) => x.classList.remove('cur'));
  document.getElementById('c-' + id).classList.add('cur');
  const bad = c.result === '泄露' || c.result === '误拦';
  const end = c.result === '放行' ? ['ok', '放行（对照）'] : bad ? ['no', c.result === '泄露' ? '泄露' : '误拦'] : ['ok', '挡住'];
  document.getElementById('d').innerHTML =
    `<div class="t">${esc(c.config)} · ${esc(c.attack)}<span>exit ${c.exit ?? '—'}</span></div>` +
    `<div class="hops">${c.hops.map((h) => `<div class="hop ${h.s}"><div class="k">${esc(h.k)}</div><div class="v">${esc(h.v)}</div></div>`).join('')}<div class="end ${end[0]}">${end[1]}</div></div>` +
    `<pre>$ ${esc(c.command)}${c.out ? '\n' + esc(c.out) : ''}</pre>`;
}

function fill(c) {
  const k = meta.configs.indexOf(c.config), r = meta.attacks.indexOf(c.attack), id = `${k}-${r}`;
  done[id] = c;
  const bad = c.result === '泄露' || c.result === '误拦';
  const td = document.getElementById('c-' + id);
  td.className = bad ? 'no' : 'ok';
  td.innerHTML = `${esc(c.result)}${c.by ? `<small>${esc(c.by)}</small>` : ''}<div class="dots">${c.hops.map((h) => `<i class="${h.s}"></i>`).join('')}</div>`;
  const leaks = meta.attacks.filter((a) => a !== 'HR 正常查').map((a, rr) => done[`${k}-${meta.attacks.indexOf(a)}`]).filter(Boolean);
  const n = leaks.filter((x) => x.result === '泄露').length;
  const el = document.getElementById('n-' + k);
  el.textContent = `泄露 ${n}`; el.className = 'n ' + (n ? 'no' : 'ok');
  show(id);
}

async function run() {
  if (running) return; running = true;
  const b = document.getElementById('b'); b.disabled = true; b.textContent = '运行中…';
  done = {}; meta = null;
  const t0 = performance.now();
  const queue = []; let finished = false, error = '';
  (async () => {
    try {
      const resp = await fetch('/api/ablation-stream', { cache: 'no-store' });
      if (!(resp.headers.get('Content-Type') || '').includes('ndjson')) throw new Error('serve.py 还是旧版本，请在它的终端 Ctrl+C 后重新运行 python3 serve.py');
      const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { value, done: end } = await reader.read();
        if (end) break;
        buf += dec.decode(value, { stream: true });
        let i; while ((i = buf.indexOf('\n')) >= 0) { const line = buf.slice(0, i); buf = buf.slice(i + 1); if (line.trim()) queue.push(JSON.parse(line)); }
      }
    } catch (e) { error = String(e); }
    finished = true;
  })();
  let gen = '';
  while (!finished || queue.length) {
    if (!queue.length) { await sleep(40); continue; }
    const m = queue.shift();
    if (m.error) { error = m.error; continue; }
    if (m.meta) { meta = m.meta; gen = m.meta.generatedAt; skeleton(); continue; }
    fill(m); await sleep(PACE);
  }
  document.getElementById('f').textContent = error ? '运行失败：' + error :
    `${gen} 实跑 · 用时 ${((performance.now() - t0) / 1000).toFixed(1)} 秒（含逐格展示间隔 ${PACE} 毫秒） · 白名单用网关自己的判定函数，脚本在临时工作区真执行 · 最后一行是对照：HR 必须始终查得到`;
  b.disabled = false; b.textContent = '重跑'; running = false;
}
run();
</script>
</body>
</html>
